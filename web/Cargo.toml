# Browser client prototype: joins a deepika-sync session from a web page, through the relay.
# A crate of its own: the daemon's dependencies (SQLite, the file watcher, full Tokio)
# have no business in a browser, and its lockfile stays untouched.
[package]
name = "deepika-sync-web"
version = "0.0.1"
edition = "2024"
authors = ["Clément OLIVIER <clement.olivier@deepika.ai>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default features pull metrics and the port mapper, which do not build for browsers; a
# TLS provider must then be named explicitly.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
tokio = { version = "1", features = ["sync"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace]
