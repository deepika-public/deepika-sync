stages: [test, package, release, web]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 binutils

verify:
  stage: test
  script:
    - python3 scripts/check-docs.py
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked
    - cargo build --locked
    - python3 scripts/test-two-peers.py
    - python3 scripts/test-mesh.py

package:
  stage: package
  script:
    - python3 scripts/package.py
    - cd dist && sha256sum -c SHA256SUMS && cd ..
    - mkdir -p /tmp/deepika-sync-package-test
    - tar -xzf dist/deepika-sync-*.tar.gz -C /tmp/deepika-sync-package-test
    - export DEEPIKA_SYNC_BINARY="$(find /tmp/deepika-sync-package-test -type f -name deepika-sync)"
    - test -x "$DEEPIKA_SYNC_BINARY"
    - python3 scripts/test-two-peers.py
  artifacts:
    paths: [dist/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli@sha256:3f0a591b3b96c39ac8e28480ee99bb93201b7bcea1fbca7ed50c034098111db2
  before_script:
    - apk add --no-cache curl
  resource_group: release-$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      set -eu
      cd dist
      sha256sum -c SHA256SUMS
      for file in "deepika-sync-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz" SHA256SUMS; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/deepika-sync/$CI_COMMIT_TAG/$file"
      done
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'deepika-sync $CI_COMMIT_TAG'
    description: 'Daemon Linux x86_64 GNU. Installation et limites dans les documents inclus. macOS non validé.'
    assets:
      links:
        - name: 'Daemon Linux x86_64'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/deepika-sync/$CI_COMMIT_TAG/deepika-sync-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz'
        - name: 'SHA256SUMS'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/deepika-sync/$CI_COMMIT_TAG/SHA256SUMS'

# The browser client: a static page that joins a session through the relay. It is
# published from the default branch, and only when something under web/ changed.
.web-rules: &web-rules
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [web/**/*, .gitlab-ci.yml]

web-wasm:
  stage: web
  <<: *web-rules
  needs: []
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: web-wasm-1
    paths: [.cargo/bin/, .cargo/registry/, web/target/]
  before_script:
    # ring compiles C to WebAssembly, which takes clang.
    - apt-get update && apt-get install -y --no-install-recommends clang
    - rustup target add wasm32-unknown-unknown
    # The CLI must be the exact version of the wasm-bindgen crate in the lockfile.
    - BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' web/Cargo.lock)
    - export PATH="$CARGO_HOME/bin:$PATH"
    - wasm-bindgen --version | grep -q " $BINDGEN\$" || cargo install wasm-bindgen-cli --version "$BINDGEN" --locked --force
  script:
    - cd web
    - cargo build --locked --target wasm32-unknown-unknown --release
    - wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/deepika_sync_web.wasm
  artifacts:
    paths: [web/pkg/]
    expire_in: 1 day

pages:
  stage: web
  <<: *web-rules
  image: node:24.14.1-bookworm@sha256:80fc934952c8f1b2b4d39907af7211f8a9fff1a4c2cf673fb49099292c251cec
  needs: [web-wasm]
  before_script: []
  script:
    - cd web
    - npm ci
    - npm run build
    - mkdir -p ../public
    - cp index.html ../public/
    - cp -r dist pkg ../public/
  artifacts:
    paths: [public]
