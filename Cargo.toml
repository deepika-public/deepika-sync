[package]
name = "deepika-sync"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
authors = ["Clément OLIVIER <clement.olivier@deepika.ai>"]
license = "MIT"
description = "Local-first collaboration daemon for text folders"

[dependencies]
anyhow = "1"
iroh = "=1.2.0"
iroh-mdns-address-lookup = "0.5"
yrs = "0.28"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
cap-std = "4"
notify = "8"
data-encoding = "2"
percent-encoding = "2"
rand = "0.10"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
file-rotate = "0.8"
postcard = { version = "1", features = ["alloc", "use-std"] }
similar = "3"
notify-debouncer-full = "0.7"
lsp-server = "0.10"
lsp-types = "0.97"

[dev-dependencies]
tempfile = "3"
