# Binaires de toutes les plateformes. Le dépôt GitHub est un miroir de GitLab (source) :
# chaque push sur main construit et teste le daemon sur Linux et macOS ; chaque tag vX.Y.Z
# poussé par le miroir publie en plus les archives, leur SHA256SUMS et leur attestation de
# provenance dans une release GitHub, celle où le plugin dot-sync installe le daemon.
name: Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, test: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, test: true }
          - { target: aarch64-apple-darwin, os: macos-15, test: true }
          # Construit sur Apple Silicon : ni tests ni exécution, faute de Rosetta.
          - { target: x86_64-apple-darwin, os: macos-15, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Tests
        if: matrix.test
        run: cargo test --locked
      - name: Archive
        run: python3 scripts/package.py --target ${{ matrix.target }}
      - name: Deux pairs réels, avec le binaire de l'archive
        if: matrix.test
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf dist/deepika-sync-*.tar.gz -C "$RUNNER_TEMP/package"
          DEEPIKA_SYNC_BINARY="$(find "$RUNNER_TEMP/package" -type f -name deepika-sync)" python3 scripts/test-two-peers.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rassembler les archives
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            cp "$dir"/*.tar.gz dist/
            cat "$dir/SHA256SUMS" >> dist/SHA256SUMS
          done
          cd dist && sha256sum --strict -c SHA256SUMS && test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Attester la provenance des archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Une release existante (relance) est complétée, pas recréée.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "deepika-sync $TAG" \
              --notes "Binaires Linux (x86_64, arm64, statiques) et macOS (Apple Silicon, Intel ; expérimental). Notes de version : https://gitlab.com/deepika-public/deepika-obsidian-toolbox/deepika-sync/-/releases/$TAG"
          fi
